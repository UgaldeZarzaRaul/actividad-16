# Configuración de Prometheus
global:
  scrape_interval: 15s       # intervalo de revisión
  scrape_timeout: 10s        # tiempo de espera de cada solicitud
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  # Prometheus se monitorea a sí mismo
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas propias de la aplicación Laravel (endpoint /metrics)
  - job_name: laravel
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          app: laravel

  # Disponibilidad HTTP (servidor web + aplicación) mediante Blackbox Exporter
  - job_name: disponibilidad-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8000/
          - http://host.docker.internal:8000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Base de datos MySQL
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
